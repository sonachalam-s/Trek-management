{% extends "base.html" %}
{% block title %}Login – TrekMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow">
      <div class="card-header bg-trek text-white text-center">
        <h4 class="mb-0"><i class="bi bi-box-arrow-in-right"></i> Login</h4>
      </div>
      <div class="card-body p-4">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Username or Email</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-trek w-100">Login</button>
        </form>
        <p class="mt-3 text-center small">
          No account? <a href="{{ url_for('register') }}">Register here</a>
        </p>
        <hr>
        <p class="small text-muted mb-0">
          Demo: <code>admin / admin123</code> or <code>trekker / trekker123</code>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
