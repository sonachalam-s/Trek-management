{% extends "base.html" %}
{% block title %}Profile – TrekMS{% endblock %}

{% block content %}
<h1 class="mb-4">My Profile</h1>
<div class="row">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" value="{{ current_user.username }}" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text" class="form-control" value="{{ current_user.email }}" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name" class="form-control" value="{{ current_user.full_name or '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Fitness Level</label>
            <select name="fitness_level" class="form-select">
              <option value="beginner" {% if current_user.fitness_level=='beginner' %}selected{% endif %}>Beginner</option>
              <option value="intermediate" {% if current_user.fitness_level=='intermediate' %}selected{% endif %}>Intermediate</option>
              <option value="advanced" {% if current_user.fitness_level=='advanced' %}selected{% endif %}>Advanced</option>
            </select>
          </div>
          <button type="submit" class="btn btn-trek">Save Changes</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
